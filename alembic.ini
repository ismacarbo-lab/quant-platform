[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Overridden at runtime from Settings.database_url. Placeholder only.
sqlalchemy.url = postgresql+psycopg://quant:quant_dev_only_not_for_production@127.0.0.1:5434/quant_platform

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
